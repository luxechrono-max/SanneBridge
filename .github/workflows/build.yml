name: Build SanneBridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install -g typescript esbuild

      - name: Build plugin
        run: |
          esbuild src/index.ts \
            --bundle \
            --format=esm \
            --platform=neutral \
            --loader:.ts=tsx \
            --external:@vendetta/* \
            --outfile=index.js

      - name: Commit compiled plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --cached --quiet || git commit -m "Build plugin JavaScript"
          git push
