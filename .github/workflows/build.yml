name: Build SanneBridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install rollup rollup-plugin-esbuild @rollup/plugin-commonjs @rollup/plugin-node-resolve

      - name: Build plugin
        run: |
          mkdir -p build

          cat > build/build.mjs <<'EOF'
          import { readFile, writeFile } from "fs/promises";
          import { createHash } from "crypto";
          import { rollup } from "rollup";
          import esbuild from "rollup-plugin-esbuild";
          import commonjs from "@rollup/plugin-commonjs";
          import nodeResolve from "@rollup/plugin-node-resolve";

          const plugins = [
            nodeResolve(),
            commonjs(),
            esbuild({
              minify: true
            })
          ];

          const bundle = await rollup({
            input: "./src/index.ts",
            onwarn: () => {},
            plugins
          });

          await bundle.write({
            file: "./index.js",

            globals(id) {
              if (id.startsWith("@vendetta")) {
                return id.substring(1).replace(/\//g, ".");
              }

              const map = {
                react: "window.React"
              };

              return map[id] || null;
            },

            format: "iife",
            compact: true,
            exports: "named"
          });

          await bundle.close();

          const js = await readFile("./index.js");
          const hash = createHash("sha256")
            .update(js)
            .digest("hex");

          const manifest = JSON.parse(
            await readFile("./manifest.json", "utf8")
          );

          manifest.main = "index.js";
          manifest.hash = hash;

          await writeFile(
            "./manifest.json",
            JSON.stringify(manifest, null, 2) + "\n"
          );
          EOF

          node build/build.mjs

      - name: Commit compiled plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.js manifest.json

          git diff --cached --quiet || \
            git commit -m "Build SanneBridge"

          git push
