name: Build Custom Voice Messages+

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools
        run: |
          npm install rollup @rollup/plugin-commonjs @rollup/plugin-node-resolve rollup-plugin-esbuild

      - name: Build plugin
        run: |
          cd customVoiceMessages

          mkdir -p build

          cat > build/build.mjs <<'EOF'
          import { readFile, writeFile } from "fs/promises";
          import { createHash } from "crypto";
          import { rollup } from "rollup";
          import commonjs from "@rollup/plugin-commonjs";
          import nodeResolve from "@rollup/plugin-node-resolve";
          import esbuild from "rollup-plugin-esbuild";

          const plugins = [
            nodeResolve(),
            commonjs(),
            esbuild()
          ];

          const bundle = await rollup({
            input: "./src/index.ts",
            onwarn: () => {},
            plugins,
            external: (id) =>
              id === "react" ||
              id === "react-native" ||
              id.startsWith("@vendetta/")
          });

          await bundle.write({
            file: "./index.js",
            format: "iife",
            compact: true,
            exports: "named",
            globals: (id) => {
              if (id.startsWith("@vendetta/"))
                return id.substring(1).replace(/\//g, ".");

              if (id === "react")
                return "window.React";

              if (id === "react-native")
                return "window.ReactNative";

              return id;
            }
          });

          await bundle.close();

          const js = await readFile("./index.js");
          const hash = createHash("sha256")
            .update(js)
            .digest("hex");

          const manifest = JSON.parse(
            await readFile("./manifest.json", "utf8")
          );

          manifest.main = "index.js";
          manifest.hash = hash;

          await writeFile(
            "./manifest.json",
            JSON.stringify(manifest, null, 2) + "\n"
          );
          EOF

          node build/build.mjs

      - name: Commit compiled plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add customVoiceMessages/index.js customVoiceMessages/manifest.json

          git diff --cached --quiet || git commit -m "Build Custom Voice Messages+ plugin"

          git push
