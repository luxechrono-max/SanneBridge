name: Build SanneBridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Build plugin
        run: |
          esbuild src/index.ts \
            --bundle \
            --format=iife \
            --platform=neutral \
            --loader:.ts=tsx \
            --external:@vendetta/* \
            --outfile=index.js \
            --global-name=SanneBridge

      - name: Generate plugin hash
        run: |
          HASH=$(sha256sum index.js | cut -d ' ' -f1)
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.main = 'index.js';
            m.hash = '$HASH';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Commit compiled plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js manifest.json
          git diff --cached --quiet || git commit -m "Build SanneBridge plugin"
          git push
