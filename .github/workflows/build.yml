name: Build Custom Voice Messages+

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install -g esbuild

      - name: Build plugin
        run: |
          cd customVoiceMessages
          esbuild src/index.ts \
            --bundle \
            --format=iife \
            --global-name=CustomVoiceMessagesPlus \
            --platform=neutral \
            --loader:.ts=tsx \
            --loader:.tsx=tsx \
            --external:@vendetta/metro \
            --external:@vendetta/metro/* \
            --external:@vendetta/ui \
            --external:@vendetta/ui/* \
            --external:@vendetta/plugin \
            --external:@vendetta/storage \
            --external:@vendetta/patcher \
            --external:@vendetta/utils \
            --outfile=index.js

      - name: Commit compiled plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customVoiceMessages/index.js
          git diff --cached --quiet || git commit -m "Build Custom Voice Messages+"
          git push
